# Builds CameraViewerApp (LensCheck) for Windows and Linux and uploads
# packaged archives as workflow artifacts. Pushing a tag like `v1.2.0`
# additionally publishes those archives to a GitHub Release.
name: Build

on:
  push:
    branches: [develop, main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    branches: [develop, main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  APP_NAME: LensCheck
  BUILD_TYPE: Release
  QT_VERSION: '6.10.0'
  OPENCV_VERSION: '4.12.0'

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="$(git rev-parse --short HEAD)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "package=${APP_NAME}-${v}-windows-x64" >> "$GITHUB_OUTPUT"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Cache OpenCV
        id: cache-opencv
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/opencv
          key: opencv-${{ env.OPENCV_VERSION }}-windows

      - name: Download OpenCV
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          $exe = "$env:RUNNER_TEMP\opencv-installer.exe"
          Invoke-WebRequest -Uri "https://github.com/opencv/opencv/releases/download/$env:OPENCV_VERSION/opencv-$env:OPENCV_VERSION-windows.exe" -OutFile $exe
          # The installer is a 7-Zip SFX that extracts to an 'opencv' folder
          7z x $exe "-o$env:RUNNER_TEMP" -y | Out-Null
          if (-not (Test-Path "$env:RUNNER_TEMP\opencv\build\OpenCVConfig.cmake")) { throw "Unexpected OpenCV package layout" }

      - name: Set up OpenCV environment
        run: |
          $root = "$env:RUNNER_TEMP/opencv/build" -replace '\\', '/'
          $vc = Get-ChildItem "$root/x64" -Directory -Filter 'vc*' | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $vc) { throw "No x64/vc* folder found in $root" }
          # CMakeLists.txt copies DLLs from $OPENCV_BIN_DIR/<Debug|Release>, but the
          # prebuilt package has a single flat bin folder, so stage the release DLLs.
          $staged = "$env:RUNNER_TEMP/opencv-bin" -replace '\\', '/'
          New-Item -ItemType Directory -Force "$staged/Release" | Out-Null
          Get-ChildItem "$($vc.FullName)/bin/*.dll" |
            Where-Object { $_.BaseName -notmatch 'd$' } |
            Copy-Item -Destination "$staged/Release"
          "OPENCV_DIR=$root" >> $env:GITHUB_ENV
          "OPENCV_BIN_DIR=$staged" >> $env:GITHUB_ENV

      - name: Configure
        run: |
          $sdk = "$env:GITHUB_WORKSPACE/CameraSDK" -replace '\\', '/'
          cmake -S CameraViewerApp -B CameraViewerApp/build -G "Visual Studio 17 2022" -A x64 `
            -DCAMERA_SDK_PATH="$sdk" `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build CameraViewerApp/build --config $env:BUILD_TYPE --parallel

      - name: Package
        run: |
          $pkg = "$env:RUNNER_TEMP/package/${{ steps.version.outputs.package }}"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item "CameraViewerApp/build/$env:BUILD_TYPE/*" $pkg -Recurse

          # Pull in any Qt plugins/libraries the CMake post-build copy step misses
          windeployqt --release --no-compiler-runtime "$pkg/CameraViewerApp.exe"

          # App-local MSVC runtime so the zip runs without installing vc_redist
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Where-Object Name -match '^\d+\.\d+' |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $crt = Get-ChildItem "$($redist.FullName)\x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          Copy-Item "$($crt.FullName)\*.dll" $pkg

          Copy-Item "LensCheck User Guide.pdf" $pkg
          New-Item -ItemType Directory -Force "$pkg/license" | Out-Null
          Copy-Item Documents/LICENSE "$pkg/license/LICENSE.txt"
          Copy-Item CameraViewerApp/license/* "$pkg/license"

          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $pkg -DestinationPath "dist/${{ steps.version.outputs.package }}.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.version.outputs.package }}
          path: dist/${{ steps.version.outputs.package }}.zip
          if-no-files-found: error

  build-linux:
    name: Linux (x64, Ubuntu 24.04)
    runs-on: ubuntu-24.04
    env:
      CAMERA_SDK_PATH: ${{ github.workspace }}/OptiTrack_Camera_SDK_3.4.1_Final_Ubuntu
    steps:
      - uses: actions/checkout@v6

      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="$(git rev-parse --short HEAD)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "package=${APP_NAME}-${v}-linux-x64" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          # The xcb/xkbcommon/EGL libs are runtime deps of Qt's xcb platform plugin,
          # needed here so the packaged plugins resolve in the ldd check below.
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential patchelf \
            libgl1-mesa-dev libglu1-mesa-dev libegl1 libjpeg-dev libopencv-dev \
            libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      # Same Qt as the Windows job (Ubuntu's packaged Qt is 6.4, too old for this code)
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Configure
        run: |
          cmake -S CameraViewerApp -B CameraViewerApp/build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCAMERA_SDK_PATH="$CAMERA_SDK_PATH" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build CameraViewerApp/build --parallel

      - name: Package
        run: |
          pkg="$RUNNER_TEMP/package/${{ steps.version.outputs.package }}"
          mkdir -p "$pkg/license" "$pkg/lib" "$pkg/translations"
          build=CameraViewerApp/build
          cp -r "$build/CameraViewerApp" "$build/Assets" "$build/i18n" "$build/motive.css" "$pkg/"
          cp "$CAMERA_SDK_PATH/lib/libCameraLibrary.so" "$pkg/"

          # Bundle Qt (the system Qt on Ubuntu 24.04 is older than the one we build against).
          # Plugins first, then every Qt library the executable or those plugins load.
          qt_plugins="$QT_ROOT_DIR/plugins"
          mkdir -p "$pkg/plugins/platforms"
          cp "$qt_plugins/platforms/libqxcb.so" "$pkg/plugins/platforms/"
          for dir in xcbglintegrations imageformats iconengines platforminputcontexts; do
            if [ -d "$qt_plugins/$dir" ]; then cp -r "$qt_plugins/$dir" "$pkg/plugins/"; fi
          done
          binaries=("$pkg/CameraViewerApp" $(find "$pkg/plugins" -name '*.so'))
          for bin in "${binaries[@]}"; do
            LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:$pkg" ldd "$bin"
          done | awk '{print $3}' | grep -F "$QT_ROOT_DIR/lib/" | sort -u | xargs -r cp -L -t "$pkg/lib/"
          cp "$QT_ROOT_DIR/translations/qtbase_zh_CN.qm" "$pkg/translations/"
          printf '[Paths]\nPrefix = .\nPlugins = plugins\nTranslations = translations\n' > "$pkg/qt.conf"

          # CameraLibrary sits next to the executable, Qt libraries in lib/
          patchelf --set-rpath '$ORIGIN:$ORIGIN/lib' "$pkg/CameraViewerApp"
          find "$pkg/plugins" -name '*.so' -exec patchelf --set-rpath '$ORIGIN/../../lib' {} \;
          find "$pkg/lib" -name '*.so*' -exec patchelf --set-rpath '$ORIGIN' {} \;

          cp "LensCheck User Guide.pdf" "$pkg/"
          cp Documents/LICENSE "$pkg/license/LICENSE.txt"
          cp CameraViewerApp/license/* "$pkg/license/"
          cat > "$pkg/README.txt" <<'EOF'
          LensCheck (CameraViewerApp) - Linux build for Ubuntu 24.04 x64

          Qt is bundled. Runtime requirements (OpenCV and the X11/xcb libraries Qt uses):
            sudo apt install -y libopencv-dev libgl1 libegl1 libjpeg-turbo8 libfontconfig1 \
              libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
              libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

          Set the camera network interface to Link-Local Only:
            Settings > Network > Wired (camera port) > IPv4 > IPv4 Method > Link-Local Only

          Run:
            ./CameraViewerApp
          EOF

          # Fail if any shared library cannot be resolved on a clean runner install,
          # or if any Qt library would load from outside the package
          deps=$(for bin in "${binaries[@]}"; do env -u LD_LIBRARY_PATH ldd "$bin"; done)
          if grep 'not found' <<<"$deps"; then exit 1; fi
          if grep 'libQt6' <<<"$deps" | grep -vF "$pkg/"; then echo "Qt library resolved outside the package"; exit 1; fi

          mkdir -p dist
          tar -C "$RUNNER_TEMP/package" -czf "dist/${{ steps.version.outputs.package }}.tar.gz" "${{ steps.version.outputs.package }}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.version.outputs.package }}
          path: dist/${{ steps.version.outputs.package }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
